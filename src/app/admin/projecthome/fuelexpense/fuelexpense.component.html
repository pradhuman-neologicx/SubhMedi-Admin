<div class="row" >
    <form [formGroup]="fueltypeform">
        <div class="mb-3 ">
            <label class="d-block text-capitalize form-label form-lable-custom" for="date">Date
            </label>
            <input type="date" class="d-block form-control form-input-custom" formControlName="date"
                [ngClass]="{ 'is-invalid':fueltypeform.controls['date'].errors && (fueltypeform.controls['date'].touched || fueltypeform.controls['date'].dirty) }">
            <div class="text-danger error-message"
                *ngIf="fueltypeform.controls['date'].errors && (fueltypeform.controls['date'].touched || fueltypeform.controls['date'].dirty)">
                <p class="fw-light text-danger"
                    *ngIf="fueltypeform.controls['date'].errors['required']">
                    Date is required</p>

            </div>
        </div>




        <div class="col-lg-12 col-md-12 mb-3 mt-3">
            <label for="chequetwo" class="form-label lable-custom">Payment Types</label>
            <div class="d-flex mt-2">
              <div class="form-check me-3">
                <label class="form-check-label">
                  <input
                    class="form-check-input"
                    type="radio"
                    (change)="onPaymentTypeChange()"
                    name="paymentType"
                    formControlName="paymentType"
                    id="paymentWithParty"
                    value="withParty"
                    [ngClass]="{
                      'is-invalid':
                        fueltypeform.controls['paymentType'].errors &&
                        (fueltypeform.controls['paymentType'].touched ||
                          fueltypeform.controls['paymentType'].dirty)
                    }"
                  />
                  Payment with Party
                </label>
              </div>
          
              <div class="form-check me-3">
                <label class="form-check-label">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="paymentType"
                    formControlName="paymentType"
                    id="paymentWithoutParty"
                    value="withoutParty"  (change)="onPaymentTypeChange()"
                    [ngClass]="{
                      'is-invalid':
                        fueltypeform.controls['paymentType'].errors &&
                        (fueltypeform.controls['paymentType'].touched ||
                          fueltypeform.controls['paymentType'].dirty)
                    }"
                  />
                  Payment without Party
                </label>
              </div>
            </div>
          
            <!-- Validation message for payment type -->
            <div
              class="text-danger mt-2 d-block"
              *ngIf="
                fueltypeform.controls['paymentType'].errors &&
                (fueltypeform.controls['paymentType'].touched ||
                  fueltypeform.controls['paymentType'].dirty)
              "
            >
              <p
                class="fw-light text-danger"
                *ngIf="fueltypeform.controls['paymentType'].errors['required']"
              >
                Payment type is required
              </p>
            </div>
          </div>






        <div class="mb-3 " *ngIf="fueltypeform.get('paymentType')?.value === 'withParty'">
            <label class="form-label form-lable-custom" 
                for="selectpartyname">
                Select Party Name</label>
            <select class="form-select form-input-custom" formControlName="selectpartyname" #selectpartyname  (change)="onchange(selectpartyname.value)"
                [ngClass]="{ 'is-invalid': fueltypeform.controls['selectpartyname'].errors && (fueltypeform.controls['selectpartyname'].touched || fueltypeform.controls['selectpartyname'].dirty) }">
                <option *ngFor="let party of partynamelist" [value]="party.id">
                {{ party.name }}
            </option>
            </select>
            <div class="text-danger error-message"
                *ngIf="fueltypeform.controls['selectpartyname'].errors && (fueltypeform.controls['selectpartyname'].touched || fueltypeform.controls['selectpartyname'].dirty)">
                <p class="fw-light text-danger"
                    *ngIf="fueltypeform.controls['selectpartyname'].errors['required']">
                    Select Party Name is required
                </p>
            </div>
        </div>








        <div class="mb-3 ">
            <label class="d-block text-capitalize form-label form-lable-custom" for="Balance">
              Total Balance
            </label>
            <input type="text" class="d-block form-control form-input-custom"  
                formControlName="Balance"  [readOnly]="true" >
         
        </div>





















        <div class="mb-3 ">
            <label class="d-block text-capitalize form-label form-lable-custom" for="Amount">
             Amount Given
            </label>
            <input type="text" class="d-block form-control form-input-custom"  
                formControlName="SubTotal" 
                [ngClass]="{ 'is-invalid': fueltypeform.controls['SubTotal'].errors && (fueltypeform.controls['SubTotal'].touched || fueltypeform.controls['SubTotal'].dirty) }">
                <div class="text-danger error-message"
                *ngIf="fueltypeform.controls['SubTotal'].errors && (fueltypeform.controls['SubTotal'].touched || fueltypeform.controls['SubTotal'].dirty)">
                <p class="fw-light text-danger"
                    *ngIf="fueltypeform.controls['SubTotal'].errors['required']">
                    Amount Given is required
                </p>
            </div>
        </div>




         <div class="mb-3 ">
        <label class="d-block text-capitalize form-label form-lable-custom" for="description">Description</label>
        <textarea class="d-block form-control form-input-custom" rows="3" formControlName="description"
            placeholder="Enter Your description"
            [ngClass]="{ 'is-invalid': fueltypeform.controls['description'].errors && (fueltypeform.controls['description'].touched || fueltypeform.controls['description'].dirty) }"></textarea>
        <div class="text-danger error-message"
            *ngIf="fueltypeform.controls['description'].errors && (fueltypeform.controls['description'].touched || fueltypeform.controls['description'].dirty)">
            <p class="fw-light text-danger"
                *ngIf="fueltypeform.controls['description'].errors['required']">
                Description is required
            </p>

        </div>
    </div> 




       












     



        <div class="col-lg-12 col-md-12 mb-3 ps-0" >
            <div class="row mx-0">

          
                <!-- Add checkboxes below the Payment input field -->
                <div class="col-lg-12 col-md-12 mb-3 mt-3">
                    <label for="cheque"
                        class="form-label lable-custom">Payment Method</label>
                    <div class="d-flex mt-2">
                        <div class="form-check me-3">
                            <label class="form-check-label">
                                <input class="form-check-input" type="radio"
                                    name="cheque"
                                    formControlName="cheque"
                                    id="0" value="0"
                                    [ngClass]="{ 'is-invalid':fueltypeform.controls['cheque'].errors && (fueltypeform.controls['cheque'].touched || fueltypeform.controls['cheque'].dirty) }">
                                    Cash
                            </label>
                        </div>

                        <div class="form-check  me-3">
                            <label class="form-check-label">
                                <input class="form-check-input" type="radio"
                                    name="cheque"
                                    formControlName="cheque"
                                    id="1" value="1" [ngClass]="{ 'is-invalid':fueltypeform.controls['cheque'].errors && (fueltypeform.controls['cheque'].touched || fueltypeform.controls['cheque'].dirty) }">
                                Bank Transfer
                            </label>
                        </div>

                        <div class="form-check  ms-2">
                            <label class="form-check-label">
                                <input class="form-check-input" type="radio"
                                    name="cheque"
                                    formControlName="cheque"
                                    id="2" value="2" [ngClass]="{ 'is-invalid':fueltypeform.controls['cheque'].errors && (fueltypeform.controls['cheque'].touched || fueltypeform.controls['cheque'].dirty) }">
                                    Cheque
                            </label>
                        </div>

                    </div>

                    <div class="text-danger mt-2 d-block"
                        *ngIf="fueltypeform.controls['cheque'].errors && (fueltypeform.controls['cheque'].touched || fueltypeform.controls['cheque'].dirty)">
                        <p class="fw-light  text-danger"
                            *ngIf="fueltypeform.controls['cheque'].errors['required']">
                            Payment Method is required
                        </p>
                    </div>
                </div>

                            formControlName="cash">
                        <label class="form-check-label" for="cash">Cash</label>
                    </div>
                </div> -->

            </div>
        </div>

        <div class="col-lg-12 col-md-12" (drop)="onDrop($event)" (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave($event)">
            <label class="form-label form-lable-custom" for="profileimage">Upload Profile
            </label>
            <label for="fileInput" class="file-label" *ngIf="!imageUrl">
                <span><img src="/assets/upload-icon.png" class="upload-icon" alt></span>
                <p class="text-gray-500"> Drag and drop or browse to choose
                    a file </p>
            </label>
            <div class="custom-file-upload position-relative" (click)="fileInput.click()">
                <input type="file" id="fileInput" #fileInput
                    accept="image/jpeg, image/jpg, image/png" (change)="onFileSelected($event)"
                    formControlName="profileimage"
                    [ngClass]="{ 'is-invalid': fueltypeform.controls['profileimage'].errors && (fueltypeform.controls['profileimage'].touched || fueltypeform.controls['profileimage'].dirty) }">
                <button *ngIf="imageUrl" (click)="clearFile($event)" class="remove-button">
                    <span><i class="fa-solid fa-xmark cross-icon"></i></span>
                </button>

                <div *ngIf="imageUrl" class="image-container">
                    <div class="black-layer"></div>
                    <img [src]="imageUrl" alt="Profile Preview" class="Profile-image" />
                </div>
            </div>
