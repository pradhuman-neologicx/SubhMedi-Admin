 <div class="row">
    <!-- Card for Advance Paid -->
    <div class="col-lg-6 col-md-6 col-sm-12 mb-3">
      <div class="card custom-card border-0 cursor h-100">
        <div class="card-body">
          <h6 class="card-title text-primary">Advance Paid</h6>
          <p class="card-text">{{ totalAdvancePaid }}</p>
        </div>
      </div>
    </div>
  
    <!-- Card for Pending to Pay -->
    <div class="col-lg-6 col-md-6 col-sm-12 mb-3">
      <div class="card custom-card border-0 cursor h-100">
        <div class="card-body">
          <h6 class="card-title text-primary">Pending to Pay</h6>
          <p class="card-text2">{{ totalToPay }}</p>
        </div>
      </div>
    </div>
  </div>
  
  




<div class="container">




    <div class="card border-0 mb-4 py-0 tabel-card">




        <form [formGroup]="FilterForm">
            <div class="row mb-2">
                <div class="col-lg-6">
                    <input type="text" class="form-control px-4 py-2 mt-2 ml-2" placeholder="Search by name" #filter
                        formControlName="filter"
                        [ngClass]="{ 'is-invalid':FilterForm.controls['filter'].errors && (FilterForm.controls['filter'].touched || FilterForm.controls['filter'].dirty) }">
                    <div class="text-danger error-message"
                        *ngIf="FilterForm.controls['filter'].errors && ( FilterForm.controls['filter'].touched ||  FilterForm.controls['filter'].dirty)">
                        <p class="fw-light  text-danger" *ngIf="FilterForm.controls['filter'].errors['required']">
                            Name is required</p>
                    </div>
                </div>
                <div class="col-lg-6">
                    <button class="btn btn-primary main-btnfs px-4 py-2 mt-2" type="button" (click)="getpartyproject(1)">Search</button>
                    <button class="btn btn-primary main-btnfs px-4 py-2 mt-2 ml-2" type="button"
                        *ngIf="showStudent!=undefined" (click)="resetFilter()">Reset</button>
                </div>
            </div>
        </form>





        <table class="table table-hover">
            <thead class="table-header-trailer">
                <tr>
                    <th>
                        <p class="table-heading table-new-heading">Serial No.</p>
                    </th>

                    <th>
                        <p class="table-heading table-new-heading">Party Name</p>
                    </th>
                    <th>
                        <p class="table-heading table-new-heading">Party Type</p>
                    </th>
                    <th>
                        <p class="table-heading table-new-heading">Amount</p>
                    </th>
                    <th>
                        <p class="table-heading table-new-heading">Status</p>
                    </th>

                    <th>
                        <p class="table-heading table-new-heading">Action</p>
                    </th>

                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let party of projectpartiestable; let i = index">
                    <td>{{ i + 1 }}</td>
                    <td>
                        <p class="table-detail text-capitalize table-detail-new">
                            {{party.name }}</p>
                    </td>
                    <td>
                        <p class="table-detail text-capitalize td-width table-detail-new">{{
                            party.type }}</p>
                    </td>
                    <td>
                        <p class="table-detail text-capitalize ms-2 table-detail-new">{{
                            party.amount}}</p>
                    </td>
                    <td>
                        <p class="table-detail text-capitalize table-detail-new" [ngClass]="{
                             'status-to-pay': party.status === 'to pay',
                             'status-to-receive': party.status === 'to receive',

                           }">
                            {{ party.status }}
                        </p>
                    </td>


                    <td>
                        <p>
                            <button mat-icon-button class="p-0" [matMenuTriggerFor]="menu">
                                <mat-icon>more_vert</mat-icon>
                            </button>

                            <mat-menu #menu="matMenu">
                                <button mat-menu-item (click)="viewmmodal(party.party_id)">View Details</button>
                                <button mat-menu-item >Edit Details</button>
                            </mat-menu>
                        </p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
