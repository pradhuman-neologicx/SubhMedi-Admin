<nav class="bg-gray-800 p-4">
  <div class="container mx-auto flex justify-between items-center">
    <!-- Logo -->
    <div class="flex items-center flex-col justify-center">
      <a routerLink="/terms-conditions">
        <img src="/assets/logo.png" alt="Logo" class="h-10 w-auto" />
      </a>
      <p class="text-white ms-1 font-semibold tracking-wide text-xl mb-0">
        SubhMedi
      </p>
    </div>

    <!-- Hamburger Menu Button (Visible on Mobile) -->
    <button
      (click)="toggleMenu()"
      class="md:hidden text-white focus:outline-none"
      aria-label="Toggle menu"
    >
      <svg
        class="w-6 h-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16m-7 6h7"
        ></path>
      </svg>
    </button>

    <!-- Navigation Links (Desktop) -->
    <div class="hidden md:flex md:space-x-4">
      <a
        routerLink="/terms-conditions"
        class="text-gray-300 hover:text-blue-400 transition-colors"
        >Terms & Conditions</a
      >
      <a
        routerLink="/privacy-policy"
        class="text-gray-300 hover:text-blue-400 transition-colors"
        >Privacy Policy</a
      >
      <a
        routerLink="/refund-policy"
        class="text-gray-300 hover:text-blue-400 transition-colors"
        >Refund Policy</a
      >
    </div>
  </div>

  <!-- Mobile Menu (Hidden by Default) -->
  <div [ngClass]="{ hidden: !isMenuOpen }" class="md:hidden">
    <div class="flex flex-col space-y-2 mt-4">
      <a
        routerLink="/terms-conditions"
        class="text-gray-300 hover:text-blue-400 transition-colors"
        >Terms & Conditions</a
      >
      <a
        routerLink="/privacy-policy"
        class="text-gray-300 hover:text-blue-400 transition-colors"
        >Privacy Policy</a
      >
      <a
        routerLink="/refund-policy"
        class="text-gray-300 hover:text-blue-400 transition-colors"
        >Refund Policy</a
      >
    </div>
  </div>
</nav>
